---
version: 1
repository:
  owner: golusoris
  name: sveltesentio
  visibility: public
  description: ''
  homepage: ''
  topics: []
profiles:
  - web-package
facets:
  - security:high
  - api:public-contract
  - docs:seo-portal
  - agent:sandboxed
overrides:
  branch_protection:
    # Owner-approved 2026-10-11: one maintainer today, so praetor renders 0 required
    # approvals. Restore independent when a second maintainer or a review bot can approve.
    review_mode: single_maintainer
# Declared per-file exceptions: one rule, one file, a reason and an expiry at most 90 days
# ahead. An expired entry fails its gate like a missing one.
exceptions:
  - rule: HISS-11
    path: .github/workflows/release-please.yml
    reason: the release job attests provenance in the job that builds and publishes, which is SLSA Build Level 2, and no step signs with cosign; the manifest declares Level 3 and cosign (#280)
    expires: "2027-01-09"
  - rule: declared-linters
    tool: semgrep
    reason: no workflow runs semgrep; CodeQL (codeql.yml, javascript-typescript, a required check) is the static analysis owner for this code; the semgrep registry rule packs cannot be pinned to a version, so a semgrep job would not be reproducible until a pinned rule source is chosen
    expires: "2027-01-11"
  - rule: declared-linters
    tool: svelte-check
    reason: no workflow or package script runs svelte-check; the packages type-check with tsc --noEmit, which does not read the 64 tracked .svelte files under packages/, so those files are not type-checked in CI; adding svelte-check is a new tooling step, not part of the engine pin sweep
    expires: "2027-01-11"
register:
  sources:
    expected: 13
    sha256:
      sha256:25f491d6da25827a2808a10129bb738cf2bea1890a316051a1be30d6919c9dd7
    inputs:
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: operating_contract.*
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: invariants.*
