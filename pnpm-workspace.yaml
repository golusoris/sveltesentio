# esbuild/sharp/onnxruntime/protobufjs ship prebuilt binaries; their build
# scripts are not needed to lint/typecheck/test/build the src/-only packages.
# pnpm 11.7 only reads this from pnpm-workspace.yaml (not .npmrc / env), and it
# governs every command (install + the pnpm-script deps preflight), so CI stays green.
strictDepBuilds: false
packages:
  - 'packages/*'
  - 'apps/*'
# Storybook releases frequently; exclude its (dev-only, never-shipped) packages
# from pnpm's minimumReleaseAge cooldown so the showcase app always installs
# (version-less so Renovate bumps don't re-trip the gate).
minimumReleaseAgeExclude:
  - '@storybook/*'
  - storybook
onlyBuiltDependencies:
  - esbuild
  - onnxruntime-node
  - protobufjs
  - sharp
# One override is left. `pnpm audit` is the gate for everything else: a fresh
# resolution without any other override picks patched releases on its own
# (measured 2026-10-11, audit clean). Add an override only when no upstream
# release carries the fix, and give it the reason and the condition that ends it.
overrides:
  # runed 0.35.1 (through bits-ui and svelte-toolbelt) and 0.37.1 (through
  # layerchart) declare an optional @sveltejs/kit peer ^2.21.0, which kept
  # SvelteKit 2.70.3 and its cookie 0.6.0 (GHSA-pxg6-pf52-xh8x) in the lockfile
  # after the kit 2 alias was dropped (ADR-0058). Ends when bits-ui,
  # svelte-toolbelt and layerchart depend on runed >=0.38.0, whose peer is
  # ^3.0.0. Review by 2027-01-09.
  'runed>@sveltejs/kit': '^3.0.0'
allowBuilds:
  esbuild: set this to true or false
  onnxruntime-node: set this to true or false
  protobufjs: set this to true or false
