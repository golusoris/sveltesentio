strictDepBuilds: false
packages:
  - 'packages/*'
  - 'apps/*'
# Storybook releases frequently; exclude its (dev-only, never-shipped) packages
# from pnpm's minimumReleaseAge cooldown so the showcase app always installs
# (version-less so Renovate bumps don't re-trip the gate).
minimumReleaseAgeExclude:
  - '@storybook/*'
  - storybook
onlyBuiltDependencies:
  - esbuild
  - onnxruntime-node
  - protobufjs
  - sharp
# Force-bump vulnerable transitive dev/build deps to their patched releases so
# `pnpm audit` is clean (§2.5). All reach the tree only via build/dev tooling
# (vite→esbuild, @vite-pwa→workbox→serialize-javascript, storybook/vite→undici)
# or consumer-provided peers (@sveltejs/kit→cookie); none ship in the src/-only
# package tarballs.
overrides:
  serialize-javascript: '>=7.0.5'
  esbuild: '>=0.28.1'
  cookie: '>=0.7.0 <1' # >=0.7.0 fixes CVE-2024-47764; <1 because 1.x bundles its own
  # types, which take precedence over @types/cookie and drop CookieParseOptions,
  # the name SvelteKit's own types use. 2.x additionally removes parse/serialize.
  undici: '>=7.29.0 <8' # 8.x removes internals jsdom 29 requires; stay on patched 7.x
  fast-uri: '>=3.1.5'
  browserslist: '>=4.28.7'
  brace-expansion@1: '>=1.1.13'
  brace-expansion@2: '>=2.1.4'
  brace-expansion@4: '>=5.0.9'
  brace-expansion: '>=2.1.4 <3 || >=5.0.9'
  sharp: '>=0.35.0'
  js-yaml: '>=4.3.1 <6'
  nanoid: '>=3.3.18'
  postcss: '>=8.5.18'
  adm-zip: '>=0.6.0'
  ip-address: '>=10.3.1'
allowBuilds:
  esbuild: set this to true or false
  onnxruntime-node: set this to true or false
  protobufjs: set this to true or false
