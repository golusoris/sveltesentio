# Declared enforcement evidence for the HISS invariants (HISS-20).
#
# Every claim here is replayed against .config/hiss/testdata by
# `praetorctl hiss coverage --verify`, which runs inside verify-all.
#
# Most claims in this repository carry a `runner`: ESLint, tsc, vitest or a
# script decides them, not praetor's HISS scanner. A claim with a runner is
# verified for *attribution* rather than enforcement — the scanner must report
# none of its fixtures, and if it reports one, the claim credits the wrong tool.
#
# Since engine 7cf9cbb2d8cc the scanner reads TypeScript and reports three
# shapes here: direct self-recursion (HISS-01), `while (true)` with no scalar
# bound (HISS-02) and `eval` (HISS-08). Those three claims carry no runner and
# are replayed. The catalog allows one decider per rule and language, so the
# shapes of the same rules that `pnpm check:cycles` or ESLint decide cannot sit
# in positive/ beside them: they are filed under gap/, and each mechanism names
# the gate that refuses them. cordanaLLM/praetor#1241 asks for more than one
# decider per claim; when it lands, those fixtures move back to positive/.
#
# States:
#   enforced       every shape the corpus describes is reported
#   partial        some shapes reported; gap/ names the rest
#   unsupported    nothing reported for this language; gap/ records what goes undetected
#   not_applicable the axiom does not apply to this language
#   manual         upheld by review, not by a runnable check -- never report it as a gate
#
# Every state below was measured during the 2026-09-15 adoption, not assumed;
# HISS-01, HISS-02 and HISS-08 for TypeScript were measured again on 2026-10-11.
# `eslint --print-config` was used to confirm which rules are actually on rather
# than reading the config's intent. An absent claim is honest; an unbacked one is
# the defect this mechanism exists to prevent.
version: 1
rules:
  - id: HISS-01
    title: Acyclic Control Flow
    coverage:
      - language: typescript
        state: partial
        mechanism: >-
          The engine scanner, run as `praetorctl audit` in the lefthook
          pre-commit and pre-push hooks and in verify-all, reports direct
          self-recursion; with a baseline of 0 any finding fails the run. That
          is the shape replayed here. Import cycles have a second decider the
          scanner does not see:
          scripts/check-import-cycles.mjs, run as `pnpm check:cycles` in the CI
          Lint job and in verify-all. It builds two graphs from static
          import/export specifiers and from dynamic `import()` calls with a
          literal specifier -- modules within packages/*/src, and packages via
          @sveltesentio/* specifiers -- and fails on the first cycle in either,
          printing the path. Self-recursion is also reported by the
          `@sveltesentio/no-recursion` ESLint rule, which resolves a self-call
          through scope analysis rather than by name. An ESLint rule for cycles
          would have meant a new dependency, which hard rule 2 puts behind a
          D-row; a script needs none.
        rationale: >-
          Partial is the state of the replay, not of the repository: every
          shape in the corpus is refused by a gate, but only self-recursion by
          the decider this entry can name. The three cycle fixtures sit under
          gap/ for that reason alone (cordanaLLM/praetor#1241).

          Three cycle shapes are reported, each verified by planting it and
          watching the checker exit 1 with the path before removing it: a
          two-module static cycle inside core, a core-to-ui-to-core package
          cycle, and a cycle closed by `await import('./peer.js')`. The dynamic
          shape was measured both ways -- the previous checker reported "OK: no
          import cycles" on it.

          Self-recursion is reported too, by `@sveltesentio/no-recursion`, which
          was measured free before being enabled -- zero self-calls across all
          163 shipped modules, so it pins the current state rather than
          demanding a cleanup. Scope analysis is what makes it trustworthy: a
          shadowing inner binding of the same name is not reported, and an arrow
          bound to a const is, which name matching gets backwards in both
          directions. Mutual recursion between two functions stays out of scope
          and is stated on the rule. Resolution is no longer listed as a gap for aliases, which
          would need the TypeScript resolver: no package declares
          `compilerOptions.paths` and no package source imports through an alias,
          so it is vacuous here rather than a silent hole. A computed specifier
          -- `import(name)` -- still cannot be followed syntactically.
      - language: svelte
        state: unsupported
        mechanism: none. No component-graph or import-cycle check runs anywhere.
        rationale: >-
          A component that renders itself is the Svelte form of the same defect
          and nothing reports it; svelte/valid-compile is about compiler
          diagnostics, not the call graph.

  - id: HISS-02
    title: Bounded Loops and I/O
    coverage:
      - language: typescript
        state: partial
        mechanism: >-
          The engine scanner, run as `praetorctl audit` in the lefthook
          pre-commit and pre-push hooks and in verify-all, reports a
          `while (true)` with no scalar bound. No rule requires an AbortSignal
          on fetch; `@typescript-eslint/recommended-type-checked` contains
          nothing for either shape.
        rationale: >-
          The unbounded loop was a gap fixture until engine 7cf9cbb2d8cc, whose
          scanner reads TypeScript and reports it; the fixture moved to
          positive/. The `fetch` with no signal stays a genuine gap: nothing
          this repository runs reports it.

  - id: HISS-04
    title: Complexity Bounds
    coverage:
      - language: typescript
        state: enforced
        runner: eslint
        mechanism: >-
          eslint.config.ts sets `complexity: ['error', 10]` and
          `max-lines-per-function` at 60 (blank lines and comments skipped) over
          packages/*/src/**/*.ts. Confirmed on with `eslint --print-config`, and
          the length cap verified to bite by planting a 66-line function and
          watching it report.
        rationale: >-
          Cyclomatic complexity is enforced and the tree is clean at 10: thirteen
          functions were over it and all thirteen were refactored, not exempted.

          Length is enforced too, as of BUG-007. Six functions were over the
          effective max_func_loc of 60 -- useForm 100, createIpcClient 98,
          createResumableUpload 76, createConnectStream 74, useConnectStream 67,
          useSSE 66. All six are under it now, and five came down by removing
          duplication rather than by shaving: the message buffer and the
          reconnect scheduler that two transports each carried, the in-flight
          request queue, and the store-to-rune mirror that useForm had written
          out nine times.

          No exception remains. createConnectStream carried an
          `eslint-disable-next-line` at 66 lines while it was a closure factory;
          it is a class now, its longest method is 16 lines, and no
          `max-lines-per-function` suppression is left in the tree.

          The engine scan measures the raw line span of a function, blank lines
          and comments included, so it is stricter than the ESLint entry. At
          engine 7cf9cbb2d8cc it reported seven functions over 60 that ESLint
          accepted or did not cover -- useLLMChat 62, useSSE 61,
          createResumableUpload 62, createConnectStream 70, the e2e `mount` 74,
          the test helper createFakeStream 63 and analyzeChanges 73 in
          scripts/. All seven were split, each behind tests written first, and
          `praetorctl baseline --verify --all-violations` reports 0. useSSE and
          useLLMChat sit at exactly 60.
      - language: svelte
        state: partial
        runner: eslint
        mechanism: >-
          The same `complexity` entry matches packages/*/src/**/*.svelte, so
          component script blocks are bounded.
        rationale: >-
          One component function was over the cap and was refactored. The same
          `max-lines-per-function` entry matches component script blocks, and no
          component is over it.

  - id: HISS-07
    title: Checked Errors
    coverage:
      - language: typescript
        state: partial
        runner: eslint
        mechanism: >-
          `@typescript-eslint/no-floating-promises`, `no-misused-promises` and
          `no-non-null-assertion`, the last enabled over packages/*/src by this
          repository — which required declaring the plugin in that config object,
          since flat config resolves a rule's plugin from the object it appears
          in. `no-empty` from eslint:recommended covers the swallowed catch.
          Errors route through `@sveltesentio/core/errors` by convention, which
          nothing checks.
        rationale: >-
          An unawaited promise is reported, and so is a non-null assertion: the
          rule was enabled after this catalog first declared it a gap. It was not
          free — four assertions in shipped source were fixed rather than
          exempted, two in charts/palette.ts where a non-empty tuple type now
          carries what the construction already guaranteed, and two in flow/dag.ts
          where the loop tests `shift()` instead of asserting it. The remaining gap is the
          routing — the invariant requires every error to leave package code as
          an RFC 9457 ProblemDetails through `@sveltesentio/core/errors`, and a
          bare `throw new Error` is unreported.

  - id: HISS-08
    title: Static Determinism
    coverage:
      - language: typescript
        state: partial
        mechanism: >-
          The engine scanner, run as `praetorctl audit` in the lefthook
          pre-commit and pre-push hooks and in verify-all, reports `eval`;
          that is the shape replayed here. ESLint is the second decider and
          the only one for HTML sinks:
          `no-eval`, `no-new-func` and `no-implied-eval` over packages/*/src,
          enabled by this repository after the first version of this catalog
          recorded them as OFF, plus the local
          `@sveltesentio/no-unsanitised-html` rule in packages/core/src/eslint.ts.
          Measured free: zero violations in shipped source.
        rationale: >-
          Dynamic execution is reported in all three of its forms, including
          `setTimeout` on a string, and so is an unsanitised HTML sink:
          `@sveltesentio/no-unsanitised-html` was written for this gap after the
          catalog named it, and reports `innerHTML`, `outerHTML` and
          `insertAdjacentHTML` unless the value comes from `sanitizeHtml()` or a
          `.sanitize()` call. A sink reached through bracket notation is reported too:
          the rule resolves a string-literal computed key, because
          `host['innerHTML']` is as statically known as `host.innerHTML` and
          skipping it made the bracket form a silent bypass. Measured both ways --
          against the previous rule the same fixture produced no diagnostic.

          Both halves of what used to be the gap are closed by resolving one
          hop through a `const` that is assigned exactly once: `const prop =
          'innerHTML'; host[prop] = raw` is now reported, and `const clean =
          sanitizeHtml(raw); host.innerHTML = clean` is no longer reported as
          though it were raw. Measured both ways -- against the previous rule the
          first produced no diagnostic and the second produced a false one.

          The three sink fixtures ESLint reports sit under gap/ beside the one
          genuine gap, because this entry can name one decider and the scanner
          is silent on them (cordanaLLM/praetor#1241). `dynamic-sink-key.ts` is
          the only fixture there that no gate reports.

          It stays partial because a key or value that is not statically knowable
          stays unresolved: a parameter, or a `let` written again between its
          initialiser and the sink. That is deliberate rather than pending.
          Guessing safe would hide an injection; guessing unsafe would report
          every computed property assignment in the tree and train people to
          disable the rule. `dynamic-sink-key.ts` holds that shape.
      - language: svelte
        state: partial
        runner: eslint
        mechanism: svelte/no-at-html-tags, confirmed on via print-config.
        rationale: >-
          `{@html}` is the Svelte innerHTML boundary and it is reported, which is
          the determinism risk that matters in a component. `eval` inside a
          component script is still unreported, as in TypeScript.

  - id: HISS-10
    title: Zero-Warning Cascade
    coverage:
      - language: typescript
        state: enforced
        runner: tsc
        mechanism: >-
          tsconfig.base.json sets strict, noUncheckedIndexedAccess and
          exactOptionalPropertyTypes; `turbo typecheck` runs tsc --noEmit per
          package, and since this adoption every package's tsconfig.test.json
          covers test/ as well as src/. `pnpm format:check` and
          `pnpm lint:scripts` run in the same CI job, so compiler, linter and
          formatter all report zero.
        rationale: >-
          Type warnings are errors and the tree is clean: putting tests under a
          project surfaced 32 and all 32 were fixed. Lint now also covers the
          root scripts/ directory, which no linter reached before.

          Formatting is no longer the gap. It was recorded as 574 then 591
          non-conformant files, which measurement reframed: 381 of 475 source
          files are tab-indented against a config that said `useTabs: false`, so
          the tree was non-conformant by configuration rather than by neglect.
          The config now says tabs, the tree is normalised to match, and
          `pnpm format:check` runs in the CI Lint job over the whole repository.
          Praetor-managed artifacts are excluded in .prettierignore: reformatting
          them fails the audit, which is how the devcontainer broke during this
          change.

  - id: HISS-15
    title: Three-Dimensional Testing
    coverage:
      - language: typescript
        state: partial
        runner: vitest
        mechanism: >-
          All 19 packages declare vitest coverage thresholds; auth and forms
          carry 85%. `turbo test` runs them and CI gates on the result.
          `pnpm check:export-tests` (scripts/check-export-tests.mjs, CI lint job
          and `make verify-all`) fails when an exported value is named in no
          test file of its package.
        rationale: >-
          Coverage is enforced and measurable, and no exported value ships
          without a test that names it. It is partial because neither check
          proves that the negative and boundary dimensions exist -- nothing
          checks that a public export has all three; review holds that.

  - id: HISS-16
    title: Context Integrity
    coverage:
      - language: internal
        state: enforced
        runner: praetorctl
        mechanism: >-
          `praetorctl compile-context --verify` runs in the lefthook pre-commit
          hook and again in `make verify-all`. AGENTS.md is the single source;
          the six vendor projections are generated.
        rationale: >-
          Hand-editing any projection fails the commit. Measured: an earlier
          commit in this adoption desynced .cursor/rules/hiss-invariants.mdc when
          a formatter rewrote it, and the gate caught it before the push.

  - id: HISS-17
    title: State Ledger Discipline
    coverage:
      - language: internal
        state: enforced
        runner: praetorctl
        mechanism: >-
          The lefthook post-commit hook runs `praetorctl state sync .`, the
          commit-msg hook rejects a message when the ledger is stale, and
          `make state-audit` runs inside verify-all, failing on an unresolved P0
          or a pending question.
        rationale: >-
          Measured during this adoption: a commit was rejected with "state
          synchronization stale; run praetorctl state sync ." until the ledger
          was synced. Sync alone proved insufficient though — it kept an empty
          ledger fresh for a whole session while nine bugs and thirteen decisions
          lived only in the transcript. `state audit` is what reads the contents,
          and it reported Valid:false on the first P0 recorded, so verify-all now
          runs it.

  - id: HISS-18
    title: CI Efficiency
    coverage:
      - language: internal
        state: enforced
        runner: node
        mechanism: >-
          scripts/ci-affected.mjs computes the affected set, and ci.yml gates the
          heavy jobs on `has_code_changes` while the if:always() `CI Gate`
          aggregator still reports. The aggregator runs scripts/ci-gate.mjs,
          which accepts a skipped heavy job only when Detect Changes succeeded
          and reported no code changes on a non-push event, and requires every
          other need to succeed (scripts/ci-gate.test.mjs). The script is itself linted by
          `pnpm lint:scripts`, and turbo.json names the root configs as
          globalDependencies so a cached result cannot outlive the config that
          produced it.
        rationale: >-
          Measured on a config-only pull request in this adoption: Build, Lint,
          Test, Type check and Security audit all reported "skipping" while CI
          Gate passed, which is the behaviour the filter exists for.

          Both supports were added after that measurement, because neither held.
          Nothing linted scripts/ -- turbo lint runs per package and the hook
          glob did not match .mjs -- which hid a self-comparison that made the
          module run its CLI on import. And with no globalDependencies, turbo
          replayed cached lint and typecheck results across config changes:
          `max-lines: 1` made `eslint packages/core/src/` exit 1 on every file
          while `turbo run lint` still reported "1 successful, 1 cached, FULL
          TURBO". Every claim in this catalog that cites a turbo task depended
          on that cache being keyed correctly.

  - id: HISS-19
    title: Reuse Before Writing
    coverage:
      - language: typescript
        state: manual
        mechanism: >-
          none runnable. `praetorctl dedupe scan` exists and reports "Not
          applicable: no Go sources found" for this tree: the detector reads Go
          only.
        rationale: >-
          Upheld by review only. Two live examples from this adoption: an
          identical bounded-history trim duplicated across useSSE and
          useConnectStream, and a requireAt helper needed by both ui and flow --
          both found by reading, neither by a tool. Recorded as manual so no gate
          claims it.
