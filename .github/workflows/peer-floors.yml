name: Peer floors

# The CI workflow installs the lockfile, which holds the newest release inside
# every peer range. This workflow installs the lowest release instead
# (scripts/pin-peer-floors.mjs), so a package that uses an API newer than the
# floor it declares fails here before a consumer on that floor finds out.
#
# Weekly, because a dependency update can raise a floor without any change in
# this repository. On pull requests that change a package manifest: the
# release pull request bumps every one, and a changed peer range or dependency
# is where a floor breaks.
on:
  schedule:
    - cron: '45 5 * * 1'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'packages/*/package.json'
      - 'pnpm-workspace.yaml'
      - 'scripts/pin-peer-floors.mjs'
      - '.github/workflows/peer-floors.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  floors:
    name: Peer floors
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.pull_request.draft != true
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event.pull_request.draft != true
        with:
          node-version: '24'
      # The pin script imports semver, so the lockfile install comes first.
      - name: Install the locked dependencies
        if: github.event.pull_request.draft != true
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Pin every peer to the lowest release of its range
        if: github.event.pull_request.draft != true
        run: node scripts/pin-peer-floors.mjs
      # The overrides change the resolution, so the lockfile cannot be frozen.
      - run: corepack enable && pnpm install --no-frozen-lockfile
        if: github.event.pull_request.draft != true
      - name: Check that the install holds the floors
        if: github.event.pull_request.draft != true
        run: node scripts/pin-peer-floors.mjs --verify
      - name: Type-check and test every package at the floors
        if: github.event.pull_request.draft != true
        run: pnpm exec turbo run typecheck test --filter='./packages/*' --concurrency=2
