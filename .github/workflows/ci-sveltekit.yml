name: CI (SvelteKit — reusable)

# Callers trigger on pull_request types opened, synchronize, reopened and
# ready_for_review: every job stops a draft, and the gate runs once the pull
# request is marked ready for review.
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      coverage-threshold:
        type: number
        default: 70
      working-directory:
        type: string
        default: '.'
      run-e2e:
        type: boolean
        default: false
      # JSON list of runner labels for lint, type check and test (HISS-21). One label keeps the
      # job and artifact names unchanged; more than one appends the label to each.
      runners:
        type: string
        default: '["ubuntu-26.04"]'

permissions:
  contents: read

jobs:
  pr-title:
    name: PR title (Conventional Commits)
    if: github.event_name == 'pull_request'
    # Linux only (HISS-21, #328): checks the pull request title, not the code.
    runs-on: ubuntu-26.04
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$PR_TITLE" | grep -qE '^(feat|fix|docs|chore|refactor|test|perf|ci|build|revert)(\(.+\))?(!)?: .+'; then
            echo "::error::PR title does not follow Conventional Commits."
            exit 1
          fi
          echo "OK: $PR_TITLE"

  lint:
    name: ${{ strategy.job-total > 1 && format('Lint ({0})', matrix.runner) || 'Lint' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
    defaults:
      run:
        # The coverage check quotes for bash; Windows runners default to PowerShell.
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        # inputs.working-directory does not exist before checkout.
        working-directory: ${{ github.workspace }}
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: ${{ strategy.job-total > 1 && format('Type check ({0})', matrix.runner) || 'Type check' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
    defaults:
      run:
        # The coverage check quotes for bash; Windows runners default to PowerShell.
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        # inputs.working-directory does not exist before checkout.
        working-directory: ${{ github.workspace }}
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: ${{ strategy.job-total > 1 && format('Test (coverage {0}%, {1})', inputs.coverage-threshold, matrix.runner) || format('Test (coverage {0}%)', inputs.coverage-threshold) }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
    defaults:
      run:
        # The coverage check quotes for bash; Windows runners default to PowerShell.
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        # inputs.working-directory does not exist before checkout.
        working-directory: ${{ github.workspace }}
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: corepack enable && pnpm install --frozen-lockfile
      # Options after the script name reach the test script. `pnpm test -- --coverage`
      # hands vitest a literal `--` instead, after which it ignores --coverage and
      # writes no summary (pnpm 11, measured with apps/sveltekit-fixture).
      - run: pnpm test --coverage
      # Needs the json-summary coverage reporter. A missing or unreadable summary, or a
      # figure that is not a number, fails the step; scripts/ci-sveltekit-coverage.test.mjs
      # runs this block against planted summaries.
      - name: Check coverage threshold
        env:
          THRESHOLD: ${{ inputs.coverage-threshold }}
        run: |
          node -e '
            const fs = require("fs");
            const fail = (message) => {
              console.error("::error::" + message);
              process.exit(1);
            };
            const threshold = Number(process.env.THRESHOLD);
            if (process.env.THRESHOLD === undefined || process.env.THRESHOLD.trim() === "" || !Number.isFinite(threshold)) {
              fail("coverage-threshold is not a number: " + JSON.stringify(process.env.THRESHOLD));
            }
            let pct;
            try {
              pct = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8")).total.lines.pct;
            } catch (error) {
              fail("coverage/coverage-summary.json is missing or unreadable: " + error.message);
            }
            if (typeof pct !== "number" || !Number.isFinite(pct)) {
              fail("total.lines.pct in coverage/coverage-summary.json is not a number: " + JSON.stringify(pct));
            }
            console.log("Coverage: " + pct + "% (threshold: " + threshold + "%)");
            if (pct < threshold) fail("Coverage " + pct + "% is below the threshold of " + threshold + "%");
          '
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ strategy.job-total > 1 && format('coverage-{0}', matrix.runner) || 'coverage' }}
          path: ${{ inputs.working-directory }}/coverage/
          retention-days: 7

  build:
    name: Build
    # Linux only (HISS-21, #328): The build output does not depend on the runner OS; lint, type check and test carry the platform legs.
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        # inputs.working-directory does not exist before checkout.
        working-directory: ${{ github.workspace }}
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm build

  audit:
    name: Security audit
    # Linux only (HISS-21, #328): pnpm audit reads the lockfile, which is the same on every platform.
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        # inputs.working-directory does not exist before checkout.
        working-directory: ${{ github.workspace }}
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  e2e:
    name: E2E (Playwright)
    if: inputs.run-e2e
    # Linux only (HISS-21, #328): Playwright's --with-deps installs browser system packages with apt.
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        # inputs.working-directory does not exist before checkout.
        working-directory: ${{ github.workspace }}
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: ${{ inputs.working-directory }}/playwright-report/
          retention-days: 7
