name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 7 * * 1'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality
          # Analyse source, not build output. `pnpm build` below is needed so the
          # extractor can resolve the workspace, but it also emits bundles — and
          # Storybook's carry content-hashed filenames, so any source change
          # produces "new" files whose third-party alerts are reported as newly
          # introduced by the pull request. That is how a formatting-only change
          # turned this check red while the analysis itself succeeded: 27 alerts,
          # every one of them inside apps/storybook/storybook-static/.
          config: |
            paths-ignore:
              - '**/dist/**'
              - '**/build/**'
              - '**/.svelte-kit/**'
              - '**/storybook-static/**'
              - '**/coverage/**'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: '/language:javascript-typescript'
