name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# The engine commit every hook, Makefile target and hosted job runs (.config/lefthook/engine.sh reads it).
env:
  PRAETOR_REF: ea27ae85f4910d3f8ea6450b2c0890388974fb71

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title (Conventional Commits)
    if: github.event_name == 'pull_request'
    # Linux only (HISS-21, #328): checks the pull request title, not the code.
    runs-on: ubuntu-26.04
    steps:
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$PR_TITLE" | grep -qE '^(feat|fix|docs|chore|refactor|test|perf|ci|build|revert)(\(.+\))?(!)?: .+'; then
            echo "::error::PR title does not follow Conventional Commits."
            echo "::error::Got: $PR_TITLE"
            echo "::error::Expected: <type>(<scope>): <description>"
            echo "::error::Valid types: feat fix docs chore refactor test perf ci build revert"
            exit 1
          fi
          echo "OK: $PR_TITLE"

  detect-changes:
    name: Detect Changes
    # Linux only (HISS-21, #328): computes the turbo filter from git history, which is the same on every platform.
    runs-on: ubuntu-26.04
    outputs:
      all_affected: ${{ steps.changes.outputs.all_affected }}
      has_code_changes: ${{ steps.changes.outputs.has_code_changes }}
      turbo_filter: ${{ steps.changes.outputs.turbo_filter }}
      affected_packages: ${{ steps.changes.outputs.affected_packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Detect affected packages and surfaces
        id: changes
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
          HEAD_REF: ${{ github.sha }}
        run: node scripts/ci-affected.mjs

  lint:
    name: Lint
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has_code_changes == 'true' || github.event_name == 'push'
    # Linux only (HISS-21, #328): portability.yml runs lint on Linux, macOS and Windows; this job adds the affected-package filter.
    runs-on: ubuntu-26.04
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - &setup_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - &cache_pnpm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - &pnpm_install
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Lint affected packages
        env:
          TURBO_FILTER: ${{ needs.detect-changes.outputs.turbo_filter }}
        run: |
          if [ -n "$TURBO_FILTER" ]; then
            # shellcheck disable=SC2086
            pnpm exec turbo run lint $TURBO_FILTER
          else
            pnpm lint
          fi
      - run: pnpm check:exports
      - run: pnpm check:component-stories
      # HISS-15: every exported value is named in a test of its package (scripts/check-export-tests.mjs).
      - run: pnpm check:export-tests
      # publint --strict on every published package: export condition order, files the
      # manifest names but the tarball lacks (a dangling `bin`), packaging warnings. Called
      # by name, as eslint and prettier below, so the declared-linters audit sees it; the
      # check:publint package script runs the same loop for `make verify-all`.
      - run: |
          status=0
          for dir in packages/*/; do
            node_modules/.bin/publint --strict "$dir" || status=1
          done
          exit "$status"
      - run: pnpm check:cycles
      - run: pnpm check:declared-imports
      # eslint and prettier are called by name, not through the lint:scripts and format:check
      # package scripts, so the engine's declared-linters audit sees that CI runs them.
      - run: node_modules/.bin/eslint scripts/
      - run: pnpm test:scripts
      - run: node_modules/.bin/prettier --check .

  typecheck:
    name: Type check
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has_code_changes == 'true' || github.event_name == 'push'
    # Linux only (HISS-21, #328): portability.yml runs the type check on Linux, macOS and Windows; this job adds the affected-package filter.
    runs-on: ubuntu-26.04
    steps:
      - *checkout
      - *setup_node
      - *cache_pnpm
      - *pnpm_install
      - name: Typecheck affected packages
        env:
          TURBO_FILTER: ${{ needs.detect-changes.outputs.turbo_filter }}
        run: |
          if [ -n "$TURBO_FILTER" ]; then
            # shellcheck disable=SC2086
            pnpm exec turbo run typecheck $TURBO_FILTER
          else
            pnpm typecheck
          fi
      # Every package with a `@sveltejs/kit` peer, type-checked against SvelteKit 3.
      # Not filtered by affected package: a dependency update can
      # change the result for a package whose own files did not move.
      - name: Typecheck against SvelteKit 3
        run: pnpm check:kit-compat
      # tsc reads no .svelte file, so svelte-check type-checks the components, stories
      # and test harnesses of every package that has them, against its tsconfig.test.json.
      # Not filtered by affected package, for the same reason as above. Called by name so
      # the declared-linters audit sees it; check:svelte runs the same loop for
      # `make verify-all`.
      - name: Type-check .svelte files
        run: |
          status=0
          for dir in packages/*/; do
            if find "$dir" -name node_modules -prune -o -name '*.svelte' -print | grep -q .; then
              node_modules/.bin/svelte-check --workspace "$dir" --tsconfig ./tsconfig.test.json --fail-on-warnings || status=1
            fi
          done
          exit "$status"

  test:
    name: Test (coverage)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has_code_changes == 'true' || github.event_name == 'push'
    # Linux only (HISS-21, #328): portability.yml runs the unit tests on Linux, macOS and Windows; this job adds coverage.
    runs-on: ubuntu-26.04
    steps:
      - *checkout
      - *setup_node
      - *cache_pnpm
      - *pnpm_install
      - name: Test affected packages
        env:
          TURBO_FILTER: ${{ needs.detect-changes.outputs.turbo_filter }}
        run: |
          if [ -n "$TURBO_FILTER" ]; then
            # shellcheck disable=SC2086
            pnpm exec turbo run test $TURBO_FILTER
          else
            pnpm test
          fi
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has_code_changes == 'true' || github.event_name == 'push'
    # Linux only (HISS-21, #328): the build output does not depend on the runner OS.
    runs-on: ubuntu-26.04
    steps:
      - *checkout
      - *setup_node
      - *cache_pnpm
      - *pnpm_install
      - name: Build affected packages
        env:
          TURBO_FILTER: ${{ needs.detect-changes.outputs.turbo_filter }}
        run: |
          if [ -n "$TURBO_FILTER" ]; then
            # shellcheck disable=SC2086
            pnpm exec turbo run build $TURBO_FILTER
          else
            pnpm build
          fi

  stories:
    name: Stories (axe)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has_code_changes == 'true' || github.event_name == 'push'
    # Linux only (HISS-21, #328): Playwright's --with-deps installs browser system packages with apt.
    runs-on: ubuntu-26.04
    steps:
      - *checkout
      - *setup_node
      - *cache_pnpm
      - *pnpm_install
      # One Playwright version is in the lockfile, so one browser install serves every workspace.
      - name: Install Chromium, Firefox and WebKit
        run: pnpm --filter @sveltesentio/storybook exec playwright install --with-deps chromium firefox webkit
      # Every story is rendered in Chromium, Firefox and WebKit; an axe violation or a render error fails the run.
      # Stories come from every package, so the run is not narrowed to the affected ones.
      - name: Run every story with axe
        run: pnpm test:stories

  e2e:
    name: End-to-end
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has_code_changes == 'true' || github.event_name == 'push'
    # Linux only (HISS-21, #328): Playwright's --with-deps installs browser system packages with apt.
    runs-on: ubuntu-26.04
    steps:
      - *checkout
      - *setup_node
      - *cache_pnpm
      - *pnpm_install
      - name: Install Chromium, Firefox and WebKit
        run: pnpm --filter @sveltesentio/shell exec playwright install --with-deps chromium firefox webkit
      # Only auth, media and shell define `test:e2e`; the filter narrows the run to the affected ones.
      - name: Run end-to-end tests of affected packages
        env:
          TURBO_FILTER: ${{ needs.detect-changes.outputs.turbo_filter }}
        run: |
          if [ -n "$TURBO_FILTER" ]; then
            # shellcheck disable=SC2086
            pnpm exec turbo run test:e2e $TURBO_FILTER
          else
            pnpm test:e2e
          fi
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: |
            packages/*/e2e/test-results/
            packages/*/e2e/playwright-report/
            packages/*/playwright-report/
          retention-days: 7

  audit:
    name: Security audit
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has_code_changes == 'true' || github.event_name == 'push'
    # Linux only (HISS-21, #328): pnpm audit reads the lockfile, which is the same on every platform.
    runs-on: ubuntu-26.04
    steps:
      - *checkout
      - *setup_node
      - *cache_pnpm
      - *pnpm_install
      - run: pnpm audit --audit-level=high

  # Declared by the security:high facet. gitleaks owns secret scanning; trivy below scans
  # dependencies and configuration only, so each finding has one owner. Both binaries are
  # pinned by version and sha256 of the release archive; trivy's checksum list is also
  # cosign-signed upstream, gitleaks publishes checksums only.
  secret-scan:
    name: Secret scan (gitleaks)
    # Linux only (HISS-21, #328): gitleaks scans git history, which is the same on every platform.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The scan reads every commit, not only the tip.
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -fsSL --max-time 120 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .'

  dependency-scan:
    name: Dependency and configuration scan (trivy)
    # Linux only (HISS-21, #328): trivy scans the lockfile and configuration, which are the same on every platform.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install trivy
        env:
          TRIVY_VERSION: 0.75.0
          TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
        run: |
          set -euo pipefail
          curl -fsSL --max-time 120 -o "$RUNNER_TEMP/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
      # Same threshold as the pnpm audit job: high and critical fail.
      - name: Scan lockfiles and configuration
        run: '"$RUNNER_TEMP/trivy" fs --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1 --no-progress --skip-version-check .'

  # Declared by the web-package profile. The ruleset is .semgrep.yml in this
  # repository, never a registry pack, so a scan depends on the commit alone.
  semgrep:
    name: Custom SAST (semgrep)
    # Linux only (HISS-21, #328): semgrep scans source text, which is the same on every platform.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Replay the rule fixtures
        run: bash scripts/semgrep-scan.sh --test
      - name: Scan every tracked JavaScript and TypeScript file
        run: bash scripts/semgrep-scan.sh

  docs-drift:
    name: Docs drift
    if: github.event_name == 'pull_request'
    # Linux only (HISS-21, #328): compares the exports maps of two revisions, which are the same on every platform.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check compares the exports map at both revisions, so it needs
          # the base commit present, not just the head.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # No install step: the check uses only node builtins and git.
      - name: Check that a changed surface ships its documentation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-docs-drift.mjs

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      [
        pr-title,
        detect-changes,
        lint,
        typecheck,
        test,
        build,
        stories,
        e2e,
        audit,
        secret-scan,
        dependency-scan,
        semgrep,
        docs-drift,
      ]
    # Linux only (HISS-21, #328): aggregates the results of the other jobs.
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # Every need must succeed; scripts/ci-gate.mjs lists the jobs that may skip and when.
      - name: Verify every required job succeeded or was skipped for a stated reason
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci-gate.mjs
