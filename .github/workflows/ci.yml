name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$PR_TITLE" | grep -qE '^(feat|fix|docs|chore|refactor|test|perf|ci|build|revert)(\(.+\))?(!)?: .+'; then
            echo "::error::PR title does not follow Conventional Commits."
            echo "::error::Got: $PR_TITLE"
            echo "::error::Expected: <type>(<scope>): <description>"
            echo "::error::Valid types: feat fix docs chore refactor test perf ci build revert"
            exit 1
          fi
          echo "OK: $PR_TITLE"

  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      all_affected: ${{ steps.changes.outputs.all_affected }}
      has_code_changes: ${{ steps.changes.outputs.has_code_changes }}
      turbo_filter: ${{ steps.changes.outputs.turbo_filter }}
      affected_packages: ${{ steps.changes.outputs.affected_packages }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - name: Detect affected packages and surfaces
        id: changes
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
          HEAD_REF: ${{ github.sha }}
        run: node scripts/ci-affected.mjs

  lint:
    name: Lint
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has_code_changes == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Lint affected packages
        env:
          TURBO_FILTER: ${{ needs.detect-changes.outputs.turbo_filter }}
        run: |
          if [ -n "$TURBO_FILTER" ]; then
            # shellcheck disable=SC2086
            pnpm exec turbo run lint $TURBO_FILTER
          else
            pnpm lint
          fi
      - run: pnpm check:exports

  typecheck:
    name: Type check
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has_code_changes == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Typecheck affected packages
        env:
          TURBO_FILTER: ${{ needs.detect-changes.outputs.turbo_filter }}
        run: |
          if [ -n "$TURBO_FILTER" ]; then
            # shellcheck disable=SC2086
            pnpm exec turbo run typecheck $TURBO_FILTER
          else
            pnpm typecheck
          fi

  test:
    name: Test (coverage)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has_code_changes == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Test affected packages
        env:
          TURBO_FILTER: ${{ needs.detect-changes.outputs.turbo_filter }}
        run: |
          if [ -n "$TURBO_FILTER" ]; then
            # shellcheck disable=SC2086
            pnpm exec turbo run test $TURBO_FILTER
          else
            pnpm test
          fi
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has_code_changes == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Build affected packages
        env:
          TURBO_FILTER: ${{ needs.detect-changes.outputs.turbo_filter }}
        run: |
          if [ -n "$TURBO_FILTER" ]; then
            # shellcheck disable=SC2086
            pnpm exec turbo run build $TURBO_FILTER
          else
            pnpm build
          fi

  audit:
    name: Security audit
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has_code_changes == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  ci-gate:
    name: CI Gate
    if: always()
    needs: [pr-title, detect-changes, lint, typecheck, test, build, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded or were legitimately skipped
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::One or more required CI jobs failed or were cancelled."
          exit 1
      - name: CI Gate Passed
        run: echo "All required checks passed (or were legitimately skipped for non-affected paths)."
