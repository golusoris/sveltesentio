---
# HISS-21 platform neutrality: lint, type check and unit tests on Linux, macOS and Windows.
# .github/rulesets/main.json lists every leg; apply it to the forge only after each leg's first hosted green (#328).
name: Platform Neutrality

'on':
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portability:
    name: Platform Neutrality (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-26.04
          - name: macOS
            runner: macos-26
          - name: Windows
            runner: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Detect affected packages and surfaces
        id: changes
        env:
          CI_EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
          HEAD_REF: ${{ github.sha }}
        run: node scripts/ci-affected.mjs
      - name: Lint
        env:
          TURBO_FILTER: ${{ steps.changes.outputs.turbo_filter }}
          ALL_AFFECTED: ${{ steps.changes.outputs.all_affected }}
          CI_EVENT: ${{ github.event_name }}
        run: |
          if [ "$CI_EVENT" = "pull_request" ] && [ "$ALL_AFFECTED" != "true" ] && [ -z "$TURBO_FILTER" ]; then
            echo "ci-scope: skip (zero affected packages)"
            exit 0
          fi
          if [ -n "$TURBO_FILTER" ]; then
            # shellcheck disable=SC2086
            pnpm exec turbo run lint $TURBO_FILTER
          else
            pnpm lint
          fi
      - name: Type check
        env:
          TURBO_FILTER: ${{ steps.changes.outputs.turbo_filter }}
          ALL_AFFECTED: ${{ steps.changes.outputs.all_affected }}
          CI_EVENT: ${{ github.event_name }}
        run: |
          if [ "$CI_EVENT" = "pull_request" ] && [ "$ALL_AFFECTED" != "true" ] && [ -z "$TURBO_FILTER" ]; then
            echo "ci-scope: skip (zero affected packages)"
            exit 0
          fi
          if [ -n "$TURBO_FILTER" ]; then
            # shellcheck disable=SC2086
            pnpm exec turbo run typecheck $TURBO_FILTER
          else
            pnpm typecheck
          fi
      # Turbo starts up to 10 package test tasks at once and each Vitest run
      # takes cores - 1 workers, which oversubscribes the 3-core, 7 GB macOS
      # runner: tests that take about 50 ms alone took 1 to 7 s there and
      # crossed the 5 s timeout. Two packages at a time keeps every leg bounded.
      - name: Test
        env:
          TURBO_FILTER: ${{ steps.changes.outputs.turbo_filter }}
          ALL_AFFECTED: ${{ steps.changes.outputs.all_affected }}
          CI_EVENT: ${{ github.event_name }}
        run: |
          if [ "$CI_EVENT" = "pull_request" ] && [ "$ALL_AFFECTED" != "true" ] && [ -z "$TURBO_FILTER" ]; then
            echo "ci-scope: skip (zero affected packages)"
            exit 0
          fi
          if [ -n "$TURBO_FILTER" ]; then
            # shellcheck disable=SC2086
            pnpm exec turbo run test --concurrency=2 $TURBO_FILTER
          else
            pnpm test --concurrency=2
          fi
