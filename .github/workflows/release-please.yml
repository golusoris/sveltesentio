name: release-please

on:
  push:
    branches: [main]
  # Manual run: publishes the package versions that main already holds and
  # cuts no release. It recovers a release whose tags and forge releases exist
  # while the registry refused the publish step. `pnpm -r publish` skips every
  # version the registry already has, so a repeated run adds nothing. The
  # trigger lives in this file because the registry's trusted publisher is
  # bound to the workflow filename.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    # A manual run started from any other branch is skipped: only main is
    # published. A push run is on main by its trigger.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write # create releases + tags, upload attestations
      pull-requests: write # open/update the "chore: release main" PR
      id-token: write # OIDC for npm provenance + Sigstore attestation
      attestations: write # actions/attest-build-provenance
    steps:
      # Skipped on a manual run, which then has no `releases_created` output
      # and reaches the publish steps through its event name alone.
      - id: release
        if: ${{ github.event_name == 'push' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Format release change logs: release-please generates `*` bullets and
      # double blank lines (gap C14-13) which fail prettier and markdownlint.
      # Push is not forced; if the branch moved concurrently, push fails safely
      # and the moved branch is left to the newer run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.release.outputs.prs_created == 'true' && steps.release.outputs.pr != '' }}
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          path: release-pr
          fetch-depth: 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.release.outputs.prs_created == 'true' && steps.release.outputs.pr != '' }}
        with:
          node-version: '24'

      - name: Format the release change logs
        if: ${{ steps.release.outputs.prs_created == 'true' && steps.release.outputs.pr != '' }}
        working-directory: release-pr
        env:
          BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --write CHANGELOG.md 'packages/*/CHANGELOG.md'
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: format the generated change logs"
          base=$(git rev-parse HEAD~1)
          if ! git push origin "HEAD:refs/heads/$BRANCH"; then
            if [ "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" != "$base" ]; then
              echo "::notice::A newer run formats the moved branch"
              exit 0
            fi
            exit 1
          fi

      # --- Publish to npm — runs ONLY when release-please cut a release, or
      # on a manual run (see `workflow_dispatch` above). ---
      # Gated on the SAME-JOB step output (the official release-please-action
      # pattern). The previous setup gated a separate reusable-workflow job on
      # `needs.release-please.outputs.releases_created`; that never fired (the
      # publish job was `skipped` even on release run #96, which DID create the
      # tags), so every package was published by hand. Inlining + same-job gate
      # removes the cross-job fragility. The command is also now recursive
      # (`pnpm -r publish`); the old `pnpm publish` ran at the private root and
      # would have published nothing even had the gate fired.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch' }}
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch' }}
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch' }}
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      # (ignored-build-scripts are tolerated via pnpm-workspace.yaml
      # `strictDepBuilds: false` — esbuild/sharp/etc. aren't needed to pack src/.)
      - if: ${{ steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch' }}
        run: corepack enable && pnpm install --frozen-lockfile

      # CycloneDX SBOM for the release (§2.5), generated before any package
      # reaches the registry: a release without its SBOM does not publish.
      # A failed run is repeated through workflow_dispatch, which publishes
      # only the versions the registry does not hold yet.
      # scripts/release-sbom.test.mjs refuses this step after publish or with
      # continue-on-error.
      - name: Generate SBOM (CycloneDX)
        if: ${{ steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json

      # Packages ship files:["src"] with exports → ./src/*.ts, so there is no
      # build step before publish (the tsc `build` output is never shipped).
      - name: Publish packages to npm
        if: ${{ steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch' }}
        run: pnpm -r publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true' # best-effort npm-native provenance badge

      # SLSA provenance over the artifacts that are ACTUALLY published (src/),
      # not the unshipped tsc dist/ the previous workflow mistakenly attested.
      - name: Attest build provenance
        if: ${{ steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'packages/*/src/**'
